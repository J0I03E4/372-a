name: Daily BigQuery Refresh

# Runs the same refresh_and_publish.py used locally, but on GitHub's own
# cloud runners -- so it works even if Joseph's computer is off, asleep,
# or on vacation. Requires a service-account key stored as the repo secret
# GCP_SA_KEY (Settings -> Secrets and variables -> Actions -> New repository
# secret). Until that secret exists, this workflow will fail at the auth
# step -- harmless, just means it hasn't been wired up yet.
#
# Cron is UTC and approximate (GitHub may delay a few minutes under load).
# 07:00 UTC = 12:00 AM Arizona time (no DST, always UTC-7).

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write   # needed so the workflow can git push the refreshed data

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up gcloud / bq CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure git identity for the auto-commit
        run: |
          git config user.name "372A Daily Refresh Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run refresh + publish
        run: python refresh_and_publish.py --push
