<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>372-A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0b0f0c; --panel:#10160f; --panel2:#161f14;
  --green:#4dff85; --green-dim:#2c7a49; --amber:#ffc233; --cyan:#5cf2ff;
  --red:#ff5577; --text:#e9fff0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:17px;line-height:1.5}
h1,h2,.pixel{font-family:'Press Start 2P',monospace}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:998;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.35) 100%);
}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 50px}

header{border:3px solid var(--green);padding:16px 20px;background:var(--panel);box-shadow:0 0 14px rgba(77,255,133,.2)}
header h1{color:var(--green);font-size:1.25rem;margin:0 0 12px;line-height:1.6}
.meta-line{font-size:1.05rem;color:var(--amber);display:flex;flex-wrap:wrap;gap:20px}
.meta-line span b{color:var(--cyan)}

.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;align-items:center}
.controls .tab-label{color:var(--green-dim);font-size:.95rem;margin-right:4px;text-transform:uppercase;letter-spacing:.05em}
.retro-btn{
  font-family:'Share Tech Mono',monospace;font-size:1.05rem;background:var(--panel2);color:var(--green);
  border:2px solid var(--green-dim);padding:7px 16px;cursor:pointer;letter-spacing:.03em;border-radius:3px;
}
.retro-btn:hover{border-color:var(--green);color:#fff;background:#1c2a1a}
.retro-btn.on{background:var(--green);color:#04170a;font-weight:bold;box-shadow:0 0 8px rgba(77,255,133,.5)}

.notice{border:2px solid var(--amber);border-radius:3px;background:#20180a;padding:14px 18px;margin:16px 0;color:#ffe3a3}
.notice .hd{color:var(--amber);font-family:'Press Start 2P',monospace;font-size:.65rem;margin-bottom:10px;letter-spacing:.05em}
.notice ul{margin:6px 0 0 18px;padding:0}
.notice li{margin-bottom:8px;font-size:1rem;line-height:1.5}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin:16px 0}
.kpi{border:2px solid var(--green-dim);border-radius:3px;background:var(--panel);padding:12px;text-align:center}
.kpi .l{font-size:.8rem;color:var(--cyan);letter-spacing:.04em}
.kpi .v{font-size:1.7rem;color:var(--green);margin:4px 0}
.kpi .v.bad{color:var(--red)}
.kpi .u{font-size:.8rem;color:#8fd6a3}

.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

.panel{border:2px solid var(--green);border-radius:3px;background:var(--panel);padding:16px}
.panel h2{color:var(--cyan);font-size:.85rem;margin:0 0 12px;font-weight:normal;letter-spacing:.03em}
table{width:100%;border-collapse:collapse;font-size:1rem}
th{text-align:left;color:var(--amber);border-bottom:2px solid var(--green-dim);padding:7px 8px;font-weight:bold;text-transform:uppercase;font-size:.78rem;letter-spacing:.03em}
td{padding:7px 8px;border-bottom:1px solid rgba(77,255,133,.15)}
th.cur,td.cur{background:rgba(92,242,255,.12)}
tr:nth-child(even) td{background:rgba(77,255,133,.03)}
.ok{color:var(--green);font-weight:bold}
.bad{color:var(--red);font-weight:bold}
.dash{color:#557a63}

.chartbox{height:230px;margin-bottom:14px}
.footnote{font-size:.85rem;color:#8fd6a3;margin-top:10px}

footer{margin-top:26px;color:var(--green-dim);font-size:.95rem;text-align:center;line-height:1.6}
footer .prompt{color:var(--green)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>&gt;&gt; 372-A <span class="blink">_</span></h1>
    <div class="meta-line">
      <span>REGION: <b id="mRegion"></b></span>
      <span>TECHS: <b id="mNTechs"></b></span>
      <span>REFRESH: <b id="mRefresh"></b></span>
    </div>
  </header>

  <div class="controls"><span class="tab-label">Month:</span><span id="periodTabs"></span></div>
  <div class="controls"><span class="tab-label">Metric:</span><span id="metricTabs"></span></div>
  <div class="controls"><span class="tab-label">Audio:</span><button id="soundBtn" class="retro-btn">SOUND: OFF</button></div>
  <audio id="bgAudio" src="audio/chiptune-loop.wav" loop preload="auto"></audio>

  <div class="kpis" id="kpiStrip"></div>

  <div class="grid2">
    <div class="panel">
      <h2>:: MONTHLY COMPARISON (WHOLE MARKET) ::</h2>
      <div style="overflow-x:auto">
      <table>
        <thead>
          <tr id="cmpHead"><th>METRIC</th></tr>
        </thead>
        <tbody id="cmpBody"></tbody>
      </table>
      </div>
          </div>

    <div class="panel">
      <h2 id="windowChartTitle">:: METRIC ACROSS WINDOWS ::</h2>
      <div class="chartbox"><canvas id="windowChart"></canvas></div>
      <h2 id="trendChartTitle">:: 30-DAY MARKET TREND ::</h2>
      <div class="chartbox"><canvas id="trendChart"></canvas></div>
    </div>
  </div>

  <footer>
    <div class="prompt">C:\372A\MARKET&gt; <span class="blink">_</span></div>
    <div>DATA: re-ods-explorer.us_re_fm_prod.fsai_workorders (live BigQuery) :: BUILT WITH CODE PUPPY</div>
  </footer>
</div>

<script>
const D = {"periods": {"2026-07": {"dtc": 7.04, "dtc_hp": 7.18, "ftf": 56.96, "hp_wos": 303, "n_techs": 7, "recalls": 16, "response": 49.92, "self_perf": 65.47, "sla_missing": 343, "sla_over": 246, "sla_under": 532, "stores_sum": 12, "wos": 1121, "wos_1p": 632, "wos_3p": 489}, "2026-08": {"dtc": 6.05, "dtc_hp": 5.07, "ftf": 58.73, "hp_wos": 224, "n_techs": 7, "recalls": 23, "response": 53.54, "self_perf": 52.39, "sla_missing": 335, "sla_over": 206, "sla_under": 564, "stores_sum": 12, "wos": 1105, "wos_1p": 495, "wos_3p": 610}, "2026-09": {"dtc": 4.33, "dtc_hp": 3.12, "ftf": 52.73, "hp_wos": 244, "n_techs": 7, "recalls": 13, "response": 47.56, "self_perf": 56.34, "sla_missing": 398, "sla_over": 183, "sla_under": 486, "stores_sum": 12, "wos": 1067, "wos_1p": 516, "wos_3p": 551}, "30": {"dtc": 4.3, "dtc_hp": 3.02, "ftf": 53.56, "hp_wos": 253, "n_techs": 7, "recalls": 13, "response": 48.48, "self_perf": 56.34, "sla_missing": 403, "sla_over": 186, "sla_under": 516, "stores_sum": 12, "wos": 1105, "wos_1p": 538, "wos_3p": 567}, "60": {"dtc": 5.26, "dtc_hp": 4.19, "ftf": 55.75, "hp_wos": 468, "n_techs": 7, "recalls": 36, "response": 50.48, "self_perf": 54.3, "sla_missing": 733, "sla_over": 389, "sla_under": 1050, "stores_sum": 12, "wos": 2172, "wos_1p": 1011, "wos_3p": 1161}}, "goals": {"dtc": 4.0, "dtc_hp": 1.9, "response": 85.0, "self_perf": 72.0, "ftf": 85.0}, "meta": {"region": "372-A", "refresh": "September 30, 2026", "source": "re-ods-explorer.us_re_fm_prod.fsai_workorders (live BigQuery pull, automated via refresh_and_publish.py; rates are wos_1p-weighted per-tech averages, matching 10B Region Arena methodology)", "n_techs": 7, "period_labels": {"2026-07": "JULY 2026", "2026-08": "AUGUST 2026", "2026-09": "SEPTEMBER 2026 (partial)"}, "notes": ["Rate metrics (DTC, DTC_HP, RESPONSE, SELF PERF, FTF) are computed as a wos_1p-weighted average of per-technician rows -- matching the methodology used by the sibling \"10B Region Arena\" dashboard (the wider region 372-A sits inside), so the two are directly comparable. A tech with wos_1p=0 is excluded entirely from the weighting.", "FOOD Equipment technicians are not trackable at the individual-tech level for 372-A stores (trade_aligned_tech_name is NULL on 100% of FOOD work orders here) -- Food Equipment KPIs are omitted rather than guessed. See the sibling 372a-tableau project for the one place FOOD data exists. This means 372-A numbers still will not fully match 10B Region Arena even with matching math, since that region-wide dashboard does track FE techs.", "High-priority (HP) DTC uses P1/P2 priority tiers, not the table's native emergency-only high_priority flag -- interpret with caution on small samples.", "This is a whole-market rollup: all technicians in 372-A are combined into one aggregate. No individual names or per-tech breakdowns are shown."]}};

const METRICS = {
  dtc:       {label:'DTC',        unit:'d', goal:D.goals.dtc,       lowerBetter:true,  decimals:2},
  self_perf: {label:'SELF PERF',  unit:'%', goal:D.goals.self_perf, lowerBetter:false, decimals:1},
  response:  {label:'RESPONSE',   unit:'%', goal:D.goals.response,  lowerBetter:false, decimals:1},
  ftf:       {label:'FTF',        unit:'%', goal:D.goals.ftf,       lowerBetter:false, decimals:1},
};
// Both the top Month tabs and the Monthly Comparison table use the same
// real calendar months (from meta.period_labels) -- no more rolling windows.
const PERIODS = Object.keys(D.meta.period_labels || {}).sort();
const CMP_PERIODS = PERIODS;
function periodLabel(p){ return (D.meta.period_labels && D.meta.period_labels[p]) || p; }
function periodLabelShort(p){
  const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const parts = p.split('-');
  if(parts.length===2){ return MONTH_ABBR[parseInt(parts[1],10)-1] + ' ' + parts[0]; }
  return periodLabel(p);
}
function idFor(p){ return 'th' + p.replace(/[^a-zA-Z0-9]/g,'_'); }

let curPeriod = PERIODS[PERIODS.length-1], curMetric = 'dtc';
let windowChart = null, trendChart = null;

document.getElementById('mRegion').textContent = D.meta.region;
document.getElementById('mNTechs').textContent = D.meta.n_techs;
document.getElementById('mRefresh').textContent = D.meta.refresh;

function fmt(v, d=2, suf=''){ return (v===null || v===undefined) ? '<span class="dash">--</span>' : Number(v).toFixed(d)+suf; }
function goalClass(v, goal, lowerBetter){
  if(v===null || v===undefined) return 'dash';
  return lowerBetter ? (v<=goal ? 'ok':'bad') : (v>=goal ? 'ok':'bad');
}

function renderPeriodTabs(){
  document.getElementById('periodTabs').innerHTML = PERIODS.map(p =>
    `<button class="retro-btn ${p===curPeriod?'on':''}" data-p="${p}">${periodLabelShort(p)}</button>`
  ).join('');
  document.querySelectorAll('#periodTabs button').forEach(b=>b.onclick=()=>{
    curPeriod = b.dataset.p; renderAll();
  });
}

function renderMetricTabs(){
  document.getElementById('metricTabs').innerHTML = Object.keys(METRICS).map(m =>
    `<button class="retro-btn ${m===curMetric?'on':''}" data-m="${m}">${METRICS[m].label}</button>`
  ).join('');
  document.querySelectorAll('#metricTabs button').forEach(b=>b.onclick=()=>{
    curMetric = b.dataset.m; renderMetricTabs(); renderWindowChart(); renderTrendChart(); renderChartTitles();
  });
}

function renderChartTitles(){
  const m = METRICS[curMetric];
  const cmp = m.lowerBetter ? '<=' : '>=';
  document.getElementById('windowChartTitle').textContent = `:: ${m.label} BY MONTH (GOAL ${cmp} ${m.goal}${m.unit}) ::`;
  document.getElementById('trendChartTitle').textContent = `:: 3-MONTH MARKET TREND -- ${m.label} ::`;
}

function renderKpis(){
  const p = D.periods[curPeriod];
  let hits = 0, total = 0;
  Object.keys(METRICS).forEach(m=>{
    if(p[m]!=null){ total++; if(METRICS[m].lowerBetter ? p[m]<=METRICS[m].goal : p[m]>=METRICS[m].goal) hits++; }
  });
  const kpis = [
    {l:'TOTAL WOS', v: p.wos, u:`in ${periodLabelShort(curPeriod)}`, cls:''},
    {l:'AVG DTC', v: fmt(p.dtc,2), u:`goal <= ${D.goals.dtc}d`, cls:goalClass(p.dtc,D.goals.dtc,true)},
    {l:'AVG SELF PERF', v: fmt(p.self_perf,1), u:`goal >= ${D.goals.self_perf}%`, cls:goalClass(p.self_perf,D.goals.self_perf,false)},
    {l:'AVG RESPONSE', v: fmt(p.response,1), u:`goal >= ${D.goals.response}%`, cls:goalClass(p.response,D.goals.response,false)},
    {l:'AVG FTF', v: fmt(p.ftf,1), u:`goal >= ${D.goals.ftf}%`, cls:goalClass(p.ftf,D.goals.ftf,false)},
    {l:'HP WOS', v: p.hp_wos, u:'high priority', cls:''},
    {l:'RECALLS', v: p.recalls, u:'this window', cls: p.recalls>0?'bad':''},
    {l:'OBJECTIVES MET', v: `${hits}/${total}`, u:'rate goals hit', cls: hits===total?'ok':(hits===0?'bad':'')},
  ];
  document.getElementById('kpiStrip').innerHTML = kpis.map(k=>`
    <div class="kpi"><div class="l">${k.l}</div><div class="v ${k.cls}">${k.v}</div><div class="u">${k.u}</div></div>
  `).join('');
}

function renderComparisonTable(){
  document.getElementById('cmpHead').innerHTML = '<th>METRIC</th><th>GOAL</th>' +
    CMP_PERIODS.map(p => `<th id="${idFor(p)}">${periodLabel(p)}</th>`).join('') +
    '<th>30D TREND</th>';
  const rows = [
    {l:'TOTAL WOS', key:'wos', fmt:(v)=>fmt(v,0)},
    {l:'HIGH-PRIORITY WOS', key:'hp_wos', fmt:(v)=>fmt(v,0)},
    {l:'DTC (DAYS)', key:'dtc', fmt:(v)=>fmt(v,2), goal:D.goals.dtc, goalUnit:'d', lowerBetter:true},
    {l:'RESPONSE %', key:'response', fmt:(v)=>fmt(v,1,'%'), goal:D.goals.response, goalUnit:'%', lowerBetter:false},
    {l:'SELF PERF %', key:'self_perf', fmt:(v)=>fmt(v,1,'%'), goal:D.goals.self_perf, goalUnit:'%', lowerBetter:false},
    {l:'FTF %', key:'ftf', fmt:(v)=>fmt(v,1,'%'), goal:D.goals.ftf, goalUnit:'%', lowerBetter:false},
  ];
  document.getElementById('cmpBody').innerHTML = rows.map(r=>`
    <tr>
      <td>${r.l}</td>
      <td class="dash">${r.goal!==undefined ? (r.lowerBetter?'&le; ':'&ge; ')+r.goal+r.goalUnit : '--'}</td>
      ${CMP_PERIODS.map(p=>{
        const v = D.periods[p][r.key];
        const cls = r.goal!==undefined ? goalClass(v,r.goal,r.lowerBetter) : '';
        return `<td class="${cls}">${r.fmt(v)}</td>`;
      }).join('')}
      <td>${trendCell(r)}</td>
    </tr>
  `).join('');
}

function trendCell(r){
  // True rolling 30-day trend: compares the last 30 days against the
  // preceding 30 days (days 31-60 ago), derived from the 30D/60D rolling
  // windows we already have (P60 - P30 = the prior 30-day slice). Rate
  // metrics are backed out via their wos-weighted sums so the comparison
  // stays consistent with how those rates are computed everywhere else.
  const p30 = D.periods['30'], p60 = D.periods['60'];
  if(!p30 || !p60) return '<span class="dash">--</span>';
  const priorWos = p60.wos - p30.wos;
  let cur, prior;
  if(r.key === 'wos' || r.key === 'hp_wos'){
    cur = p30[r.key];
    prior = p60[r.key] - p30[r.key];
  } else {
    cur = p30[r.key];
    const p60Val = p60[r.key];
    if(cur==null || p60Val==null || priorWos <= 0) return '<span class="dash">--</span>';
    prior = (p60Val * p60.wos - cur * p30.wos) / priorWos;
  }
  if(cur==null || prior==null) return '<span class="dash">--</span>';
  const delta = cur - prior;
  if(Math.abs(delta) < 1e-9) return '<span class="dash">&#9644; flat</span>';
  const arrow = delta > 0 ? '&#9650;' : '&#9660;';
  let cls = '';
  if(r.lowerBetter !== undefined){
    const improving = r.lowerBetter ? delta < 0 : delta > 0;
    cls = improving ? 'ok' : 'bad';
  }
  return `<span class="${cls}">${arrow} ${r.fmt(Math.abs(delta))}</span>`;
}

function renderWindowChart(){
  const m = METRICS[curMetric];
  const vals = CMP_PERIODS.map(p => D.periods[p][curMetric]);
  const ctx = document.getElementById('windowChart');
  if(windowChart) windowChart.destroy();
  windowChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels: CMP_PERIODS.map(p=>periodLabel(p)),
      datasets:[{
        label: m.label,
        data: vals,
        backgroundColor: vals.map(v => v==null ? '#333' : (m.lowerBetter ? (v<=m.goal?'#4dff85':'#ff5577') : (v>=m.goal?'#4dff85':'#ff5577'))),
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#8fd6a3'},grid:{color:'#1c2a1a'}},
        y:{ticks:{color:'#8fd6a3'},grid:{color:'#1c2a1a'}, beginAtZero:true}
      }
    }
  });
}

function renderTrendChart(){
  const m = METRICS[curMetric];
  const labels = CMP_PERIODS.map(p=>periodLabelShort(p));
  const metricVals = CMP_PERIODS.map(p=>D.periods[p][curMetric]);
  const wosVals = CMP_PERIODS.map(p=>D.periods[p].wos);
  const ctx = document.getElementById('trendChart');
  if(trendChart) trendChart.destroy();
  trendChart = new Chart(ctx, {
    data:{
      labels,
      datasets:[
        {
          type:'bar', label:'WOS VOLUME', data: wosVals, yAxisID:'y1',
          backgroundColor:'rgba(92,242,255,.25)', order:2,
        },
        {
          type:'line', label:m.label, data: metricVals, yAxisID:'y',
          borderColor:'#4dff85', backgroundColor:'#4dff85', tension:.25, spanGaps:true, order:1,
          pointRadius:2,
        },
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#8fd6a3'}}},
      scales:{
        x:{ticks:{color:'#8fd6a3'},grid:{color:'#1c2a1a'}},
        y:{position:'left', ticks:{color:'#4dff85'},grid:{color:'#1c2a1a'}},
        y1:{position:'right', ticks:{color:'#5cf2ff'},grid:{display:false}, beginAtZero:true},
      }
    }
  });
}

document.getElementById('soundBtn').onclick = function(){
  const btn = this;
  const a = document.getElementById('bgAudio');
  if(a.paused){
    a.play().then(() => {
      btn.textContent='SOUND: ON'; btn.classList.add('on');
    }).catch((err) => {
      console.error('Audio play() failed:', err);
      btn.textContent='SOUND: ERROR (see console)'; btn.classList.remove('on');
    });
  } else {
    a.pause(); btn.textContent='SOUND: OFF'; btn.classList.remove('on');
  }
};

function renderAll(){
  renderPeriodTabs();
  renderMetricTabs();
  renderChartTitles();
  renderKpis();
  renderComparisonTable();
  renderWindowChart();
  renderTrendChart();
}

renderAll();
</script>
</body>
</html>
